services:
  db:
    image: postgres:16-alpine
    container_name: 2sdp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deux_saisons
    ports:
      - "5432:5432"
    volumes:
      - 2sdp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deux_saisons"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  2sdp-db-data:
